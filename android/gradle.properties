org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The system JVM is OpenJDK 25 (eselect java-vm), which AGP rejects. Portage also
# provides dev-java/openjdk-bin:21 at this path, which is what AGP wants.
org.gradle.java.home=/opt/openjdk-bin-21

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
